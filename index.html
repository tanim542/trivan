<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>TRIVAN — Premium Punjabi | প্রিমিয়াম পাঞ্জাবি</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600;700&family=Cormorant+Garamond:wght@500;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #F6F3EC;
            --card: #FFFFFF;
            --ink: #1A1A1A;
            --mut: #6B665C;
            --line: #DDD6C8;
            --acc: #7A2B1D;
            --accT: #FFFFFF;
            color-scheme: light;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px)
        }

        @media(prefers-color-scheme:dark) {
            :root:not([data-theme="light"]) {
                --bg: #141311;
                --card: #1D1B18;
                --ink: #F2EEE6;
                --mut: #A39D90;
                --line: #34312B;
                --acc: #D98B6F;
                --accT: #141311;
                color-scheme: dark
            }
        }

        :root[data-theme="dark"] {
            --bg: #141311;
            --card: #1D1B18;
            --ink: #F2EEE6;
            --mut: #A39D90;
            --line: #34312B;
            --acc: #D98B6F;
            --accT: #141311;
            color-scheme: dark
        }

        html {
            scroll-padding-top: 70px
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font-family: "Noto Sans Bengali", system-ui, -apple-system, "Segoe UI", sans-serif;
            line-height: 1.55
        }

        h1,
        h2,
        h3,
        .logo {
            font-family: "Cormorant Garamond", Georgia, serif;
            font-weight: 700;
            margin: 0
        }

        a {
            color: inherit
        }

        .wrap {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 18px
        }

        section {
            padding: 56px 0;
            border-top: 1px solid var(--line)
        }

        h2 {
            font-size: 2rem;
            margin-bottom: 6px
        }

        .sub {
            color: var(--mut);
            margin: 0 0 24px
        }

        .draft {
            background: var(--ink);
            color: var(--bg);
            font-size: .78rem;
            text-align: center;
            padding: 6px 10px
        }

        header {
            position: sticky;
            top: 0;
            z-index: 10;
            background: var(--bg);
            border-bottom: 1px solid var(--line);
            padding-top: env(safe-area-inset-top, 0px)
        }

        .bar {
            display: flex;
            align-items: center;
            gap: 12px;
            height: 60px
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1.5rem;
            letter-spacing: .22em;
            text-decoration: none
        }

        nav {
            margin-left: auto;
            display: flex;
            gap: 16px;
            font-size: .88rem
        }

        nav a {
            text-decoration: none;
            color: var(--mut)
        }

        nav a:hover {
            color: var(--ink)
        }

        button {
            font: inherit;
            cursor: pointer
        }

        .btn {
            background: var(--acc);
            color: var(--accT);
            border: 0;
            padding: 12px 22px;
            border-radius: 2px;
            font-weight: 600;
            text-decoration: none;
            display: inline-block
        }

        .btn.o {
            background: none;
            color: var(--ink);
            border: 1px solid var(--ink)
        }

        .ic {
            background: none;
            border: 1px solid var(--line);
            color: var(--ink);
            padding: 6px 10px;
            border-radius: 2px;
            font-size: .85rem
        }

        @media(max-width:760px) {
            nav {
                display: none
            }

            #lang {
                margin-left: auto
            }
        }

        #menu {
            display: none;
            border-top: 1px solid var(--line)
        }

        #menu.open {
            display: flex;
            flex-direction: column
        }

        #menu a {
            padding: 12px 18px;
            text-decoration: none;
            border-bottom: 1px solid var(--line)
        }

        .soc {
            display: flex;
            gap: 14px;
            align-items: center;
            margin-bottom: 6px
        }

        .soc a,
        .soc span {
            color: var(--ink);
            display: inline-flex
        }

        .soc span {
            opacity: .45
        }

        .bot {
            margin-top: auto;
            display: flex;
            flex-direction: column;
            gap: 8px
        }

        .rv {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(min(240px, 100%), 1fr));
            gap: 14px
        }

        .rv>div {
            background: var(--card);
            border: 1px solid var(--line);
            padding: 16px
        }

        .rv small {
            display: inline-block;
            border: 1px solid var(--acc);
            color: var(--acc);
            padding: 1px 8px;
            font-size: .72rem;
            margin-bottom: 6px
        }

        .rv p {
            margin: 0
        }

        #sc td,
        #sc th {
            padding: 6px 8px;
            border-top: 1px solid var(--line);
            text-align: center;
            width: auto
        }

        #sc th {
            font-weight: 600;
            color: var(--mut);
            font-size: .8rem;
            border-top: 0
        }

        #sc td:first-child {
            width: auto;
            color: var(--ink);
            font-weight: 600
        }

        .hero {
            display: grid;
            grid-template-columns: 1.1fr .9fr;
            gap: 30px;
            align-items: center;
            padding: 48px 0
        }

        .hero h1 {
            font-size: clamp(2.4rem, 7vw, 4.2rem);
            line-height: 1.05
        }

        .hero p {
            color: var(--mut);
            max-width: 46ch
        }

        .hero .cta {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 22px
        }

        .heroart {
            background: var(--card);
            border: 1px solid var(--line);
            padding: 18px
        }

        @media(max-width:760px) {
            .hero {
                grid-template-columns: 1fr
            }
        }

        .three {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px
        }

        .three div {
            border-left: 3px solid var(--acc);
            padding: 4px 0 4px 14px
        }

        .three b {
            font-family: "Cormorant Garamond", serif;
            font-size: 1.5rem;
            color: var(--acc)
        }

        @media(max-width:760px) {
            .three {
                grid-template-columns: 1fr
            }
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(min(250px, 100%), 1fr));
            gap: 16px
        }

        .card {
            background: var(--card);
            border: 1px solid var(--line);
            display: flex;
            flex-direction: column
        }

        .card svg {
            background: var(--bg);
            border-bottom: 1px solid var(--line)
        }

        .cb {
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1
        }

        .code {
            font-size: .74rem;
            letter-spacing: .14em;
            color: var(--mut)
        }

        .card h3 {
            font-size: 1.4rem
        }

        .story {
            font-size: .9rem;
            color: var(--mut);
            margin: 0
        }

        .price {
            font-weight: 700;
            font-size: 1.1rem
        }

        select,
        input {
            font: inherit;
            background: var(--bg);
            color: var(--ink);
            border: 1px solid var(--line);
            padding: 9px;
            border-radius: 2px;
            width: 100%
        }

        details {
            border: 1px solid var(--line);
            font-size: .85rem
        }

        summary {
            padding: 8px 10px;
            cursor: pointer;
            font-weight: 600
        }

        table {
            width: 100%;
            border-collapse: collapse
        }

        td {
            padding: 5px 10px;
            border-top: 1px solid var(--line);
            vertical-align: top
        }

        td:first-child {
            color: var(--mut);
            width: 38%
        }

        .tool {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 28px;
            align-items: start
        }

        @media(max-width:760px) {
            .tool {
                grid-template-columns: 1fr
            }
        }

        .f {
            display: grid;
            gap: 12px
        }

        .f label {
            font-size: .85rem;
            color: var(--mut);
            display: grid;
            gap: 4px
        }

        .res {
            border: 1px solid var(--acc);
            padding: 14px;
            margin-top: 14px;
            display: none
        }

        .res b {
            font-size: 2rem;
            font-family: "Cormorant Garamond", serif;
            color: var(--acc)
        }

        .sw {
            display: flex;
            gap: 8px;
            flex-wrap: wrap
        }

        .sw button {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 2px solid var(--line)
        }

        .sw button.on {
            border-color: var(--acc);
            outline: 2px solid var(--acc)
        }

        .chips {
            display: flex;
            gap: 8px;
            flex-wrap: wrap
        }

        .chips button {
            padding: 8px 14px;
            border: 1px solid var(--line);
            background: none;
            color: var(--ink);
            border-radius: 2px
        }

        .chips button.on {
            background: var(--ink);
            color: var(--bg)
        }

        .feat {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(min(230px, 100%), 1fr));
            gap: 14px
        }

        .feat div {
            background: var(--card);
            border: 1px solid var(--line);
            padding: 16px
        }

        .feat h3 {
            font-size: 1.25rem;
            margin-bottom: 4px
        }

        .feat p {
            margin: 0;
            font-size: .9rem;
            color: var(--mut)
        }

        .empty {
            border: 1px dashed var(--line);
            padding: 24px;
            text-align: center;
            color: var(--mut)
        }

        footer {
            border-top: 1px solid var(--line);
            padding: 36px 0;
            color: var(--mut);
            font-size: .9rem
        }

        .fg {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: space-between
        }

        #drawer {
            position: fixed;
            top: 0;
            right: 0;
            bottom: 0;
            width: min(420px, 100%);
            background: var(--bg);
            border-left: 1px solid var(--line);
            z-index: 20;
            transform: translateX(100%);
            transition: transform .25s;
            display: flex;
            flex-direction: column;
            padding: 16px;
            padding-top: calc(16px + env(safe-area-inset-top, 0px));
            padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px))
        }

        #drawer.open {
            transform: none
        }

        #items {
            flex: 1;
            overflow: auto
        }

        .li {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 4px;
            padding: 10px 0;
            border-bottom: 1px solid var(--line);
            font-size: .9rem
        }

        .li small {
            color: var(--mut)
        }

        .q button {
            width: 26px;
            height: 26px;
            border: 1px solid var(--line);
            background: none;
            color: var(--ink)
        }

        .tot {
            display: flex;
            justify-content: space-between;
            font-weight: 700;
            padding: 10px 0
        }

        #msg {
            color: var(--acc);
            font-size: .85rem;
            min-height: 1.2em
        }

        .wa {
            position: fixed;
            right: 16px;
            bottom: calc(16px + env(safe-area-inset-bottom, 0px));
            z-index: 9;
            background: #1E7E4A;
            color: #fff;
            padding: 12px 16px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            font-size: .9rem
        }

        .lb {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            max-width: 760px;
            margin: 0 auto
        }

        .lb img {
            width: 100%;
            height: auto;
            aspect-ratio: 3/5;
            object-fit: cover;
            display: block;
            border: 1px solid var(--line)
        }

        .card img {
            width: 100%;
            height: auto;
            aspect-ratio: 3/5;
            object-fit: cover;
            display: block;
            background: var(--bg);
            border-bottom: 1px solid var(--line)
        }

        img {
            max-width: 100%
        }

        @media(max-width:760px) {
            .lb {
                grid-template-columns: repeat(2, 1fr)
            }

            .lb img:last-child {
                grid-column: 1/-1;
                width: 50%;
                justify-self: center
            }
        }

        @media(max-width:420px) {
            .wrap {
                padding: 0 14px
            }

            .bar {
                gap: 8px
            }

            .logo {
                font-size: 1.2rem;
                letter-spacing: .14em
            }

            .ic {
                padding: 6px 8px;
                font-size: .8rem
            }

            section {
                padding: 40px 0
            }

            h2 {
                font-size: 1.7rem
            }

            .wa {
                padding: 10px 13px;
                font-size: .82rem
            }
        }

        .sizes {
            display: flex;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap
        }

        .sizes span {
            font-size: .78rem;
            color: var(--mut);
            margin-right: 2px
        }

        .sizes button {
            min-width: 38px;
            height: 34px;
            padding: 0 8px;
            border: 1px solid var(--line);
            background: none;
            color: var(--ink);
            border-radius: 2px;
            font-size: .82rem;
            transition: background .2s, color .2s, border-color .2s, transform .15s
        }

        .sizes button:hover {
            border-color: var(--ink)
        }

        .sizes button:active {
            transform: scale(.92)
        }

        .sizes button.on {
            background: var(--ink);
            color: var(--bg);
            border-color: var(--ink);
            animation: pop .25s
        }

        .sizes.shake {
            animation: shake .4s
        }

        .sizes.shake button {
            border-color: var(--acc)
        }

        @keyframes pop {
            50% {
                transform: scale(1.15)
            }
        }

        @keyframes shake {
            25% {
                transform: translateX(-5px)
            }

            75% {
                transform: translateX(5px)
            }
        }

        @keyframes up {
            from {
                opacity: 0;
                transform: translateY(22px)
            }
        }

        @keyframes drop {
            from {
                opacity: 0;
                transform: translateY(-6px)
            }
        }

        @keyframes fade {
            from {
                opacity: .3
            }
        }

        .card {
            overflow: hidden;
            transition: transform .3s, box-shadow .3s
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 24px rgba(0, 0, 0, .12)
        }

        .card img {
            transition: transform .5s
        }

        .card:hover img {
            transform: scale(1.04)
        }

        .btn {
            transition: transform .15s, opacity .2s
        }

        .btn:hover {
            opacity: .9;
            transform: translateY(-1px)
        }

        .btn:active {
            transform: scale(.97)
        }

        .btn.ok {
            animation: pop .4s
        }

        .rv-in {
            opacity: 0
        }

        .rv-in.in {
            opacity: 1;
            animation: up .7s backwards
        }

        .lb img {
            transition: transform .4s
        }

        .lb img:hover {
            transform: scale(1.03)
        }

        #menu.open {
            animation: drop .25s
        }

        .li {
            animation: up .3s both
        }

        #cnt.bump {
            display: inline-block;
            animation: pop .35s
        }

        #sart svg {
            animation: fade .35s
        }

        .three>div,
        .feat>div {
            transition: transform .3s
        }

        .three>div:hover {
            transform: translateX(4px)
        }

        .feat>div:hover {
            transform: translateY(-3px)
        }

        @media(prefers-reduced-motion:reduce) {
            * {
                animation: none !important;
                transition: none !important
            }
        }

        .ic {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            min-height: 38px;
            transition: border-color .2s, transform .15s
        }

        .ic:hover {
            border-color: var(--ink)
        }

        .ic:active {
            transform: scale(.95)
        }

        #cartBtn {
            position: relative
        }

        .badge {
            position: absolute;
            top: -7px;
            right: -7px;
            min-width: 18px;
            height: 18px;
            border-radius: 9px;
            background: var(--acc);
            color: var(--accT);
            font-size: .7rem;
            line-height: 18px;
            text-align: center;
            padding: 0 5px;
            font-weight: 700
        }

        .ct {
            display: grid;
            gap: 12px
        }

        .ci {
            display: flex;
            align-items: center;
            gap: 10px
        }

        .ci svg {
            flex: none;
            color: var(--acc)
        }

        .ph {
            text-decoration: none;
            color: var(--ink);
            font-weight: 600;
            font-size: 1.05rem;
            letter-spacing: .08em;
            border: 1px solid var(--line);
            padding: 8px 14px;
            border-radius: 2px;
            width: fit-content;
            transition: border-color .2s, transform .15s
        }

        .ph:hover {
            border-color: var(--acc)
        }

        .ph:active {
            transform: scale(.97)
        }

        html {
            -webkit-text-size-adjust: 100%
        }

        body {
            overflow-x: clip
        }

        select,
        input {
            font-size: 16px
        }

        .sizes button {
            height: 36px
        }

        @media(max-width:420px) {
            .sizes button {
                min-width: 34px
            }

            .fg {
                gap: 22px
            }
        }

        footer {
            background: #1A1A1A;
            color: #CFC9BC;
            border-top: 0;
            padding: 52px 0 0
        }

        .fgrid {
            display: grid;
            grid-template-columns: 1.4fr 1fr 1.2fr;
            gap: 36px
        }

        .flogo {
            font-family: "Cormorant Garamond", Georgia, serif;
            font-weight: 700;
            font-size: 2rem;
            letter-spacing: .3em;
            color: #F2EEE6;
            margin-bottom: 8px
        }

        footer h4 {
            margin: 0 0 14px;
            font-size: .78rem;
            letter-spacing: .16em;
            text-transform: uppercase;
            color: #D98B6F;
            font-weight: 600
        }

        .fl {
            display: grid;
            gap: 10px
        }

        .fl a {
            color: #CFC9BC;
            text-decoration: none;
            width: fit-content;
            transition: color .2s, transform .2s
        }

        .fl a:hover {
            color: #fff;
            transform: translateX(4px)
        }

        footer .soc {
            margin: 18px 0 8px
        }

        footer .soc a,
        footer .soc span {
            width: 42px;
            height: 42px;
            border: 1px solid rgba(242, 238, 230, .3);
            border-radius: 50%;
            align-items: center;
            justify-content: center;
            color: #F2EEE6;
            transition: border-color .2s, transform .2s
        }

        footer .soc a:hover {
            border-color: #D98B6F;
            transform: translateY(-2px)
        }

        footer .ci svg {
            color: #D98B6F
        }

        footer .ph {
            color: #F2EEE6;
            border-color: rgba(242, 238, 230, .3)
        }

        footer .ph:hover {
            border-color: #D98B6F
        }

        .fbot {
            display: flex;
            gap: 12px;
            justify-content: space-between;
            flex-wrap: wrap;
            border-top: 1px solid rgba(242, 238, 230, .15);
            margin-top: 40px;
            padding: 18px 0;
            padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px));
            font-size: .82rem;
            color: #9A9488
        }

        @media(max-width:760px) {
            .fgrid {
                grid-template-columns: 1fr;
                gap: 28px
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="wrap bar">
            <button class="ic" id="menuBtn" aria-label="Menu" aria-expanded="false" aria-controls="menu"><svg width="20"
                    height="20" viewBox="0 0 22 22" aria-hidden="true" style="display:block">
                    <g fill="var(--acc)">
                        <rect x="2" y="3" width="18" height="3" />
                        <rect x="2" y="9.5" width="18" height="3" />
                        <rect x="2" y="16" width="18" height="3" />
                    </g>
                </svg></button><a class="logo" href="#top" aria-label="TRIVAN">TRIVAN</a>
            <nav><a href="#drop" data-t="n1"></a><a href="#fit" data-t="n2"></a><a href="#info" data-t="n4"></a></nav>
            <button class="ic" id="lang" aria-label="Language"><svg width="20" height="20" viewBox="0 0 24 24"
                    fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
                    aria-hidden="true">
                    <circle cx="12" cy="12" r="9" />
                    <path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18" />
                </svg><span id="langT">বাংলা</span></button>
            <button class="ic" id="cartBtn" aria-label="Cart"><svg width="20" height="20" viewBox="0 0 24 24"
                    fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
                    aria-hidden="true">
                    <path d="M5 8h14l-1 12H6L5 8z" />
                    <path d="M9 8V6a3 3 0 0 1 6 0v2" />
                </svg><span id="cnt" class="badge">0</span></button>
        </div>
        <div id="menu"><a href="#drop" data-t="n1"></a><a href="#fit" data-t="n2"></a><a href="#info" data-t="n4"></a><a
                href="#rev" data-t="n5"></a></div>
    </header>

    <main id="top">
        <div class="wrap hero">
